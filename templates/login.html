{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center py-3"><div class="col-md-5 col-lg-4">
  <div class="glass p-4">
    <span class="ico mb-3"><i class="bi bi-box-arrow-in-right"></i></span>
    <h3>Welcome back</h3><p class="text-secondary">Log in to continue to your dashboard.</p>
    <form method="post">
      <label class="form-label small text-secondary">Username</label>
      <input class="form-control mb-3" name="username" required autofocus>
      <label class="form-label small text-secondary">Password</label>
      <input class="form-control mb-3" type="password" name="password" required>
      <button class="btn btn-accent w-100">Login</button>
    </form>
    <div class="demo-box mt-3"><i class="bi bi-info-circle"></i> Demo user <code>demo</code> / <code>demo123</code><br><i class="bi bi-shield-lock"></i> Admin <code>admin</code> / <code>admin123</code></div>
    <p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div></div>
{% endblock %}
