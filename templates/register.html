{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center py-3"><div class="col-md-5 col-lg-4">
  <div class="glass p-4">
    <span class="ico mb-3"><i class="bi bi-person-plus"></i></span>
    <h3>Join Finspire</h3><p class="text-secondary">Create a free account in seconds.</p>
    <form method="post">
      <label class="form-label small text-secondary">Username</label>
      <input class="form-control mb-3" name="username" required minlength="3">
      <label class="form-label small text-secondary">Password</label>
      <input class="form-control mb-3" type="password" name="password" required minlength="4">
      <button class="btn btn-accent w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div></div>
{% endblock %}
